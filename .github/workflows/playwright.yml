name: Playwright Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'yvsnokvgxqtpqkuizsfo' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://yvsnokvgxqtpqkuizsfo.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      
      - name: Run Playwright tests
        run: npx playwright test --reporter=html
        env:
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID || 'yvsnokvgxqtpqkuizsfo' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://yvsnokvgxqtpqkuizsfo.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30
      
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: test-results/
      
      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testResultsPath = 'test-results/results.json';
            
            let comment = '## 🧪 Playwright Test Results\n\n';
            
            if (fs.existsSync(testResultsPath)) {
              try {
                const results = JSON.parse(fs.readFileSync(testResultsPath, 'utf8'));
                const passed = results.stats.expected;
                const failed = results.stats.unexpected;
                const total = results.stats.total;
                
                comment += `**Status:** ${failed === 0 ? '✅ All tests passed' : '❌ Some tests failed'}\n\n`;
                comment += `| Metric | Count |\n`;
                comment += `|--------|-------|\n`;
                comment += `| Total | ${total} |\n`;
                comment += `| Passed | ✅ ${passed} |\n`;
                comment += `| Failed | ${failed > 0 ? '❌ ' : ''}${failed} |\n\n`;
                
                if (failed === 0) {
                  comment += '**Great! All tests passed.** 🎉\n';
                } else {
                  comment += '**Action required:** Please fix the failing tests.\n';
                  comment += '\n📊 [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) in GitHub Actions artifacts.\n';
                }
              } catch (e) {
                comment += 'Tests completed. [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) in GitHub Actions artifacts.\n';
              }
            } else {
              comment += 'Tests execution completed. [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) in GitHub Actions artifacts.\n';
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
