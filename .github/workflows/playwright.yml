name: CI — Lint, Types, Tests, Build, E2E

# Remarque : ce workflow s'appelait auparavant "Playwright Tests". S'il existe
# une règle de protection de branche exigeant ce nom précis comme check
# obligatoire, il faudra la mettre à jour vers "CI — Lint, Types, Tests, Build, E2E".

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  ci:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Découplé du reste du pipeline (Étape 9) : l'audit de la dette ESLint
      # (Étape 8, voir rapport) recense 1219 problèmes existants sur le code
      # actuel. Les laisser bloquants rendrait la CI rouge en permanence dès
      # ce step, sans jamais atteindre Typecheck/Tests/Build/E2E — donc sans
      # jamais valider ce qui compte le plus (régressions fonctionnelles).
      # `continue-on-error: true` : le résultat reste visible dans les logs et
      # dans l'onglet Checks, mais ne bloque pas la suite. À repasser en
      # bloquant une fois la catégorie A (bugs réels, priorité) résorbée.
      - name: Lint (non bloquant — dette historique, voir Étape 8)
        run: npm run lint
        continue-on-error: true

      - name: Typecheck
        run: npm run typecheck

      - name: Tests unitaires (Vitest)
        run: npm run test:unit

      # ---- Stack Supabase LOCALE uniquement, jamais la production ----
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Démarrer Supabase local
        run: supabase start

      - name: Réinitialiser la base locale (rejoue toutes les migrations depuis une base vierge)
        run: supabase db reset
        # Valide directement l'exigence CLAUDE.md : "supabase db reset doit
        # terminer sans erreur" — sur CHAQUE pull request, pas seulement en local.

      - name: Récupérer les identifiants Supabase locaux
        id: supa
        run: |
          supabase status -o env >> "$GITHUB_ENV"
          # `supabase status -o env` exporte notamment API_URL, ANON_KEY,
          # SERVICE_ROLE_KEY (stack locale, valeurs fixes non secrètes — voir
          # .env.local.example / CLAUDE.md, jamais des identifiants de prod).

      - name: Créer le compte de test local (fixture CI minimale, jamais liée à la production)
        run: |
          set -e
          RESP=$(curl -sS -X POST "${API_URL}/auth/v1/admin/users" \
            -H "apikey: ${SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"email":"ci-test@local.test","password":"CiTestLocal2026!","email_confirm":true}')
          USER_ID=$(echo "$RESP" | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).id')
          ECOLE_ID=$(curl -sS -X POST "${API_URL}/rest/v1/ecoles" \
            -H "apikey: ${SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H 'Content-Type: application/json' -H 'Prefer: return=representation' \
            -d '{"nom":"École CI","code":"CI-TEST"}' | node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8"))[0].id')
          curl -sS -X POST "${API_URL}/rest/v1/user_roles" \
            -H "apikey: ${SERVICE_ROLE_KEY}" -H "Authorization: Bearer ${SERVICE_ROLE_KEY}" \
            -H 'Content-Type: application/json' \
            -d "{\"user_id\":\"${USER_ID}\",\"ecole_id\":\"${ECOLE_ID}\",\"role\":\"admin\"}"
          echo "LOCAL_TEST_EMAIL=ci-test@local.test" >> "$GITHUB_ENV"
          echo "LOCAL_TEST_PASSWORD=CiTestLocal2026!" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build application (contre Supabase LOCAL uniquement)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ env.API_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.ANON_KEY }}

      - name: Run Playwright tests
        run: npx playwright test --reporter=html
        env:
          VITE_SUPABASE_URL: ${{ env.API_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ env.ANON_KEY }}
          SUPABASE_LOCAL_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
          LOCAL_TEST_EMAIL: ${{ env.LOCAL_TEST_EMAIL }}
          LOCAL_TEST_PASSWORD: ${{ env.LOCAL_TEST_PASSWORD }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/
          retention-days: 30

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: test-results/

      - name: Comment PR with test results
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const testResultsPath = 'test-results/results.json';

            let comment = '## 🧪 CI Results\n\n';

            if (fs.existsSync(testResultsPath)) {
              try {
                const results = JSON.parse(fs.readFileSync(testResultsPath, 'utf8'));
                const passed = results.stats.expected;
                const failed = results.stats.unexpected;
                const total = results.stats.total;

                comment += `**Status:** ${failed === 0 ? '✅ All tests passed' : '❌ Some tests failed'}\n\n`;
                comment += `| Metric | Count |\n`;
                comment += `|--------|-------|\n`;
                comment += `| Total | ${total} |\n`;
                comment += `| Passed | ✅ ${passed} |\n`;
                comment += `| Failed | ${failed > 0 ? '❌ ' : ''}${failed} |\n\n`;

                if (failed === 0) {
                  comment += '**Great! All tests passed.** 🎉\n';
                } else {
                  comment += '**Action required:** Please fix the failing tests.\n';
                  comment += '\n📊 [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) in GitHub Actions artifacts.\n';
                }
              } catch (e) {
                comment += 'Tests completed. [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) in GitHub Actions artifacts.\n';
              }
            } else {
              comment += 'Tests execution completed. [View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) in GitHub Actions artifacts.\n';
            }

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
