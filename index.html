  <body>
    <style>
      #initial-splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:hsl(40 30% 98%);font-family:'Plus Jakarta Sans',system-ui,sans-serif;transition:opacity .4s ease}
      #initial-splash.hide{opacity:0;pointer-events:none}
      #initial-splash .logo{width:96px;height:96px;border-radius:50%;background:#fff;box-shadow:0 10px 30px -10px rgba(110,26,44,.35);display:flex;align-items:center;justify-content:center;overflow:hidden;animation:sp-pop .5s ease-out both}
      #initial-splash .logo img{width:84px;height:84px;object-fit:contain}
      #initial-splash .ring{position:absolute;width:124px;height:124px;border-radius:50%;border:2px solid transparent;border-top-color:hsl(345 65% 28%);border-right-color:hsl(50 95% 60%);animation:sp-spin 1.4s linear infinite}
      #initial-splash .label{color:hsl(345 65% 28%);font-weight:500;font-size:14px;opacity:.85;letter-spacing:.2px}
      #initial-splash .dots{display:flex;gap:6px}
      #initial-splash .dots span{width:6px;height:6px;border-radius:50%;background:hsl(345 65% 28%);animation:sp-bounce 1s infinite ease-in-out}
      #initial-splash .dots span:nth-child(2){animation-delay:.15s}
      #initial-splash .dots span:nth-child(3){animation-delay:.3s;background:hsl(50 95% 60%)}
      @keyframes sp-spin{to{transform:rotate(360deg)}}
      @keyframes sp-pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
      @keyframes sp-bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-6px);opacity:1}}
      @media (prefers-reduced-motion: reduce){#initial-splash .ring,#initial-splash .dots span,#initial-splash .logo{animation:none}}
    </style>
    <div id="initial-splash" role="status" aria-label="Chargement de l'application">
      <div style="position:relative;display:flex;align-items:center;justify-content:center">
        <div class="ring"></div>
        <div class="logo"><img src="/favicon.png" alt="La Providence" /></div>
      </div>
      <div class="label">Préparation de votre espace…</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
    <div id="root"></div>
    <script>
      window.addEventListener('load', function(){
        // Laisse React monter, puis on cache le splash
        setTimeout(function(){
          var el = document.getElementById('initial-splash');
          if(el){ el.classList.add('hide'); setTimeout(function(){ el.remove(); }, 450); }
        }, 200);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
